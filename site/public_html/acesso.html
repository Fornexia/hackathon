<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self'; base-uri 'none'; form-action 'self'">
<title>Acesso à conta | FORNEX</title>
<link rel="icon" href="icone.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/site.css?v=20261115-auth1">
<script src="assets/tema.js?v=20261115a"></script>
</head>
<body>
<header class="topo"><div class="miolo"><a class="marca" href="/">Fornex<span>IA</span></a><button type="button" class="tema-botao" data-tema-botao></button></div></header>
<main class="miolo estreito">
  <div class="cartao">
    <h1 id="titulo">Recuperar senha</h1>
    <p id="descricao" class="apoio">Informe o e-mail da sua conta para receber as instruções.</p>
    <p id="erro" class="aviso-erro" role="alert" hidden></p>
    <p id="status" class="aviso-ok" role="status" hidden></p>
    <form id="form-acesso">
      <div id="campo-email" class="campo"><label for="email">E-mail da conta</label><input id="email" type="email" autocomplete="email" maxlength="190" required></div>
      <div id="campos-senha" hidden>
        <div class="campo"><label for="senha">Nova senha do FORNEX</label><input id="senha" type="password" autocomplete="new-password" minlength="15" maxlength="128" aria-describedby="dica-senha" disabled><small id="dica-senha">De 15 a 128 caracteres. Use uma senha exclusiva do FORNEX.</small></div>
        <div class="campo"><label for="confirmacao">Confirme a senha</label><input id="confirmacao" type="password" autocomplete="new-password" minlength="15" maxlength="128" disabled></div>
      </div>
      <button class="botao cheio" id="confirmar" type="submit">Enviar instruções</button>
    </form>
    <p class="apoio"><a href="chat.html">Voltar para entrar</a> · <a href="acesso.html#reenviar" id="link-reenvio">Reenviar verificação</a></p>
  </div>
</main>
<script src="assets/api.js?v=20261115-auth1"></script>
<script src="assets/acesso.js?v=20261115-auth1"></script>
</body>
</html>
